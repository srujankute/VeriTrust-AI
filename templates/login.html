<!DOCTYPE html>
<html>
<head>
    <title>VeriTrust | Security Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f0c29; display: flex; align-items: center; justify-content: center; height: 100vh; color: white; }
        .login-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); width: 350px; }
    </style>
</head>
<body>
    <div class="login-box text-center shadow-lg">
        <h2 class="mb-4 fw-bold">VeriTrust AI</h2>
        <input type="text" id="u" class="form-control mb-3 bg-dark text-white border-secondary" placeholder="Username">
        <input type="password" id="p" class="form-control mb-4 bg-dark text-white border-secondary" placeholder="Password">
        <button onclick="doLogin()" class="btn btn-primary w-100">Login</button>
        <p id="msg" class="text-danger mt-3 small"></p>
    </div>
    <script>
        async function doLogin() {
            const u = document.getElementById('u').value;
            const p = document.getElementById('p').value;
            const res = await fetch('/auth', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({u, p})
            });
            if(res.ok) window.location.href = '/dashboard';
            else document.getElementById('msg').innerText = "Invalid Credentials";
        }
    </script>
</body>
</html>
